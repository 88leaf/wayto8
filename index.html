<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BreadPOS — Sandwich POS</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#20231f;--muted:#747873;--line:#e7e8e3;--accent:#d97706;--accent2:#f59e0b;--soft:#fff7e8;--danger:#dc2626;--success:#16803c;--shadow:0 10px 30px #0000000b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#171a17;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-size:22px;font-weight:800;padding:6px 12px 28px}.brand span{color:#f59e0b}.nav button{width:100%;background:transparent;color:#b9bdb8;text-align:left;padding:12px 14px;border-radius:12px;margin:3px 0}.nav button.active,.nav button:hover{background:#292d29;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.title h1{margin:0;font-size:28px}.title p{margin:5px 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{padding:11px 15px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:650}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.dark{background:#20231f;color:#fff}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.stat small,.muted{color:var(--muted)}.stat .num{font-size:25px;font-weight:800;margin-top:8px}.up{color:var(--success);font-size:12px;margin-top:5px}.two{grid-template-columns:1.35fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.product{padding:0;overflow:hidden}.food{height:125px;background:linear-gradient(135deg,#f8dfb5,#f3b56a);display:flex;align-items:center;justify-content:center;font-size:55px}.product .body{padding:15px}.price{font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#edf7ef;color:var(--success)}.badge.warn{background:#fff4df;color:#a16207}.badge.danger{background:#feecec;color:var(--danger)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:15px 5px 5px}.bar{flex:1;border-radius:8px 8px 3px 3px;background:#f0a52a;min-height:20px}.bar span{display:block;transform:translateY(24px);font-size:10px;color:var(--muted);text-align:center}.page{display:none}.page.active{display:block}.pos{grid-template-columns:1.5fr .9fr}.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cart{position:sticky;top:20px}.cart-item{padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{width:27px;height:27px;border-radius:8px;background:#f1f2ef}.total{font-size:21px;font-weight:850}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.recipe-row{display:grid;grid-template-columns:1.3fr .6fr .8fr .7fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:35px}.mobile-nav{display:none}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 15px 85px}.stats,.two,.three,.pos{grid-template-columns:1fr 1fr}.products-grid{grid-template-columns:1fr 1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#171a17;z-index:20;justify-content:space-around;padding:8px}.mobile-nav button{background:transparent;color:#bbb;padding:7px;font-size:11px}.mobile-nav button.active{color:#fff}.cart{position:static}}
@media(max-width:600px){.stats,.two,.three,.pos,.products-grid{grid-template-columns:1fr}.top{align-items:flex-start}.actions .btn:not(.primary){display:none}.formgrid{grid-template-columns:1fr}.recipe-row{grid-template-columns:1fr 70px 90px 60px auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Bread<span>POS</span></div><div class="nav" id="nav"></div></aside>
<main class="main">
<div class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Ringkasan bisnis hari ini</p></div><div class="actions"><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn primary" onclick="showPage('pos')">+ Transaksi Baru</button></div></div>

<section id="dashboard" class="page active"></section>
<section id="pos" class="page"></section>
<section id="menu" class="page"></section>
<section id="stock" class="page"></section>
<section id="hpp" class="page"></section>
<section id="sales" class="page"></section>
<section id="reports" class="page"></section>
<section id="admin" class="page"></section>
</main></div>
<div class="mobile-nav" id="mobileNav"></div>

<script>
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const defaultIngredients=[
['Bread','pcs',3000,80,20,'Bakery'],['Chicken','gram',55,5000,2000,'Supplier A'],['Beef','gram',70,4000,1500,'Supplier B'],
['Egg','pcs',2500,30,10,'Supplier C'],['Cheese','slice',1800,50,15,'Supplier C'],['Lettuce','gram',25,1500,500,'Supplier Sayur'],
['Tomato','gram',20,1500,500,'Supplier Sayur'],['Onion','gram',18,1500,500,'Supplier Sayur'],['Mayonnaise','gram',30,2000,500,'Supplier A'],
['BBQ Sauce','gram',28,1800,500,'Supplier A'],['Mustard','gram',25,1200,400,'Supplier A'],['Black Pepper Sauce','gram',30,1500,400,'Supplier A']
];
const defaultProducts=[
{id:1,name:'Chicken Mayo',price:15000,emoji:'🥪',recipe:[['Bread',1],['Chicken',80],['Lettuce',20],['Tomato',20],['Onion',10],['Mayonnaise',15],['Black Pepper Sauce',10]]},
{id:2,name:'Beef BBQ',price:18000,emoji:'🥪',recipe:[['Bread',1],['Beef',80],['Lettuce',20],['Tomato',20],['Onion',10],['Mayonnaise',15],['BBQ Sauce',10]]},
{id:3,name:'Egg Cheese',price:12000,emoji:'🥪',recipe:[['Bread',1],['Egg',1],['Cheese',1],['Lettuce',20],['Tomato',20],['Onion',10],['Mayonnaise',15],['Mustard',10]]}
];
let ingredients=JSON.parse(localStorage.getItem('breadpos_ing')||'null')||defaultIngredients.map(x=>({name:x[0],unit:x[1],cost:x[2],stock:x[3],min:x[4],supplier:x[5]}));
let products=JSON.parse(localStorage.getItem('breadpos_products')||'null')||JSON.parse(JSON.stringify(defaultProducts));
let sales=JSON.parse(localStorage.getItem('breadpos_sales')||'[]');
let settings=JSON.parse(localStorage.getItem('breadpos_settings')||'null')||{business:'WAY TO 8',tagline:'Grab. Bite. Repeat.',currency:'IDR',address:'',phone:''};
let cart=[]; let active='dashboard';

function save(){localStorage.setItem('breadpos_ing',JSON.stringify(ingredients));localStorage.setItem('breadpos_products',JSON.stringify(products));localStorage.setItem('breadpos_sales',JSON.stringify(sales));localStorage.setItem('breadpos_settings',JSON.stringify(settings))}
function ing(name){return ingredients.find(x=>x.name===name)}
function hpp(p){return p.recipe.reduce((s,[n,q])=>s+(ing(n)?.cost||0)*q,0)}
function fmtPct(v){return (v||0).toFixed(1).replace('.',',')+'%'}
function todaySales(){let d=new Date().toISOString().slice(0,10);return sales.filter(x=>x.date===d)}
function renderNav(){
 const items=[['dashboard','⌂','Dashboard'],['pos','▣','Kasir'],['menu','☰','Menu'],['stock','◫','Bahan & Stok'],['hpp','◈','HPP'],['sales','▤','Penjualan'],['reports','◔','Laporan'],['admin','⚙','Admin']];
 document.getElementById('nav').innerHTML=items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="showPage('${x[0]}')">${x[1]} &nbsp; ${x[2]}</button>`).join('');
 document.getElementById('mobileNav').innerHTML=items.slice(0,5).map(x=>`<button class="${active===x[0]?'active':''}" onclick="showPage('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('');
}
function showPage(id){active=id;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');let names={dashboard:['Dashboard','Ringkasan bisnis hari ini'],pos:['Kasir','Buat transaksi baru'],menu:['Menu','Produk dan resep sandwich'],stock:['Bahan & Stok','Kelola persediaan bahan baku'],hpp:['HPP','Kalkulator biaya dan margin'],sales:['Penjualan','Riwayat transaksi'],reports:['Laporan','Analisis performa bisnis'],admin:['Admin','Kelola menu, resep, bahan, harga, dan pengaturan']};document.getElementById('pageTitle').textContent=names[id][0];document.getElementById('pageSub').textContent=names[id][1];renderNav();renderAll()}
function renderAll(){renderDashboard();renderPOS();renderMenu();renderStock();renderHPP();renderSales();renderReports();renderAdmin()}
function renderDashboard(){
 const ts=todaySales(), omzet=ts.reduce((s,x)=>s+x.total,0), qty=ts.reduce((s,x)=>s+x.qty,0), profit=ts.reduce((s,x)=>s+x.profit,0);
 let low=ingredients.filter(x=>x.stock<=x.min), counts={};ts.forEach(x=>counts[x.product]=(counts[x.product]||0)+x.qty);let top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
 document.getElementById('dashboard').innerHTML=`<div class="grid stats">
 ${stat('Penjualan hari ini',money(omzet),'Live')} ${stat('Sandwich terjual',qty+' pcs','Hari ini')} ${stat('Estimasi profit',money(profit),'Gross')} ${stat('Stok menipis',low.length+' bahan',low.length?'Perlu dicek':'Aman')}
 </div><div class="grid two section"><div class="card"><div class="row"><h2>Penjualan 7 hari</h2><span class="muted">Unit</span></div><div class="chart">${[6,5,7,4,8,9,11].map((v,i)=>`<div class="bar" style="height:${v*11}px"><span>${['Sen','Sel','Rab','Kam','Jum','Sab','Min'][i]}</span></div>`).join('')}</div></div><div class="card"><h2>Produk terlaris</h2>${top?`<div style="font-size:22px;margin:25px 0">🥇 <b>${top[0]}</b><br><span class="muted">${top[1]} pcs terjual hari ini</span></div>`:'<div class="empty">Belum ada transaksi hari ini.</div>'}</div></div>
 <div class="grid two section"><div class="card"><h2>Stok perlu perhatian</h2>${low.length?`<table><tr><th>Bahan</th><th>Stok</th><th>Status</th></tr>${low.map(x=>`<tr><td>${x.name}</td><td>${x.stock} ${x.unit}</td><td><span class="badge warn">Stok menipis</span></td></tr>`).join('')}</table>`:'<div class="empty">Semua stok aman 🎉</div>'}</div><div class="card"><h2>Quick Actions</h2><div class="grid" style="gap:10px"><button class="btn primary" onclick="showPage('pos')">＋ Transaksi Baru</button><button class="btn" onclick="showPage('stock')">＋ Tambah / Update Bahan</button><button class="btn" onclick="showPage('hpp')">◈ Hitung HPP</button></div></div></div>`;
}
function stat(a,b,c){return `<div class="card stat"><small>${a}</small><div class="num">${b}</div><div class="up">${c}</div></div>`}
function renderPOS(){
 let total=cart.reduce((s,x)=>s+x.p.price*x.qty,0);
 document.getElementById('pos').innerHTML=`<div class="grid pos"><div><div class="products-grid">${products.map(p=>`<div class="card product"><div class="food">${p.emoji}</div><div class="body"><div class="row"><b>${p.name}</b><span class="badge">${fmtPct((p.price-hpp(p))/p.price*100)}</span></div><p class="muted" style="font-size:12px">Fresh sandwich • 6 inch</p><div class="row"><span class="price">${money(p.price)}</span><button class="btn primary" onclick="addCart(${p.id})">＋</button></div></div></div>`).join('')}</div></div><div class="card cart"><h2>Keranjang</h2>${cart.length?cart.map((x,i)=>`<div class="cart-item"><div class="row"><b>${x.p.name}</b><span>${money(x.p.price*x.qty)}</span></div><div class="row" style="margin-top:7px"><small class="muted">${money(x.p.price)} / pcs</small><div class="qty"><button onclick="changeCart(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeCart(${i},1)">+</button></div></div></div>`).join(''):'<div class="empty">Keranjang masih kosong</div>'}<div style="margin-top:18px"><div class="row"><span>Subtotal</span><b>${money(total)}</b></div><div class="row" style="margin:8px 0"><span>Diskon</span><span>Rp0</span></div><hr style="border:0;border-top:1px solid var(--line)"><div class="row" style="margin:12px 0"><span class="total">Total</span><span class="total">${money(total)}</span></div><select id="pay" class="field input" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px"><option>Cash</option><option>QRIS</option><option>Transfer</option><option>E-Wallet</option></select><button class="btn primary" style="width:100%;padding:14px" onclick="checkout()">BAYAR ${money(total)}</button></div></div></div>`;
}
function addCart(id){let p=products.find(x=>x.id===id),x=cart.find(x=>x.p.id===id);x?x.qty++:cart.push({p,qty:1});renderPOS()}
function changeCart(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderPOS()}
function checkout(){if(!cart.length)return alert('Keranjang masih kosong.');let date=new Date().toISOString().slice(0,10),total=cart.reduce((s,x)=>s+x.p.price*x.qty,0),qty=cart.reduce((s,x)=>s+x.qty,0),profit=cart.reduce((s,x)=>s+(x.p.price-hpp(x.p))*x.qty,0);cart.forEach(x=>x.p.recipe.forEach(([n,q])=>{let a=ing(n);if(a)a.stock-=q*x.qty}));sales.unshift({id:'TRX-'+Date.now().toString().slice(-6),date,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),product:cart.map(x=>x.p.name).join(', '),qty,total,profit,payment:document.getElementById('pay').value});save();cart=[];alert('Transaksi berhasil disimpan!');showPage('sales')}
function renderMenu(){document.getElementById('menu').innerHTML=`<div class="grid three">${products.map(p=>{let c=hpp(p),pr=p.price-c;return `<div class="card"><div style="font-size:50px">${p.emoji}</div><h2>${p.name}</h2><p class="muted">Sandwich 6 inch dengan bahan segar.</p><div class="row"><span>Harga jual</span><b>${money(p.price)}</b></div><div class="row"><span>HPP</span><span>${money(c)}</span></div><div class="row"><span>Profit</span><span class="badge">${money(pr)}</span></div><div style="margin-top:10px"><span class="badge">${fmtPct(pr/p.price*100)} margin</span></div><button class="btn" style="width:100%;margin-top:14px" onclick="showRecipe(${p.id})">Lihat / Atur Resep</button></div>`}).join('')}</div>`}
function showRecipe(id){showPage('hpp');setTimeout(()=>document.getElementById('hppProduct').value=id,0)}
function renderStock(){document.getElementById('stock').innerHTML=`<div class="card"><div class="row"><h2>Daftar bahan baku</h2><button class="btn primary" onclick="addIngredient()">＋ Tambah Bahan</button></div><table><tr><th>Bahan</th><th>Satuan</th><th>Harga/unit</th><th>Stok</th><th>Minimum</th><th>Supplier</th><th>Status</th></tr>${ingredients.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.unit}</td><td>${money(x.cost)}</td><td><input value="${x.stock}" onchange="updateStock(${i},this.value)" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:7px"></td><td>${x.min}</td><td>${x.supplier}</td><td>${x.stock<=0?'<span class="badge danger">Habis</span>':x.stock<=x.min?'<span class="badge warn">Stok menipis</span>':'<span class="badge">Aman</span>'}</td></tr>`).join('')}</table></div>`}
function updateStock(i,v){ingredients[i].stock=Number(v);save();renderStock();renderDashboard()}
function addIngredient(){let name=prompt('Nama bahan:');if(!name)return;let unit=prompt('Satuan (gram/ml/pcs):','gram'),cost=Number(prompt('Harga per satuan:','100')),stock=Number(prompt('Stok awal:','1000')),min=Number(prompt('Minimum stok:','200'));ingredients.push({name,unit,cost,stock,min,supplier:'Supplier baru'});save();renderAll()}
function renderHPP(){let p=products[0];document.getElementById('hpp').innerHTML=`<div class="card"><div class="row"><div><h2>Recipe Builder & HPP</h2><p class="muted">Harga bahan otomatis memengaruhi HPP.</p></div><select id="hppProduct" onchange="renderHPP()" style="padding:10px;border:1px solid var(--line);border-radius:9px">${products.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div id="hppDetail"></div></div>`;let sel=document.getElementById('hppProduct');let chosen=products.find(x=>x.id==sel.value)||p;let c=hpp(chosen),profit=chosen.price-c;document.getElementById('hppDetail').innerHTML=`<div style="margin-top:18px">${chosen.recipe.map(([n,q])=>`<div class="recipe-row"><b>${n}</b><span>${q} ${ing(n)?.unit||''}</span><span>${money((ing(n)?.cost||0))}/unit</span><span>${money((ing(n)?.cost||0)*q)}</span><span>✓</span></div>`).join('')}</div><div class="grid three" style="margin-top:20px"><div class="card"><small class="muted">Total HPP</small><div class="num">${money(c)}</div></div><div class="card"><small class="muted">Harga Jual</small><div class="num">${money(chosen.price)}</div></div><div class="card"><small class="muted">Gross Profit</small><div class="num">${money(profit)}</div><div class="up">Margin ${fmtPct(profit/chosen.price*100)}</div></div></div>`}
function renderSales(){document.getElementById('sales').innerHTML=`<div class="card"><div class="row"><h2>Riwayat transaksi</h2><span class="muted">${sales.length} transaksi</span></div>${sales.length?`<table><tr><th>ID</th><th>Tanggal</th><th>Produk</th><th>Qty</th><th>Total</th><th>Pembayaran</th><th>Profit</th></tr>${sales.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.date}<br><small>${x.time}</small></td><td>${x.product}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${x.payment}</td><td>${money(x.profit)}</td></tr>`).join('')}</table>`:'<div class="empty">Belum ada transaksi. Mulai dari Kasir.</div>'}</div>`}
function renderReports(){let omzet=sales.reduce((s,x)=>s+x.total,0),profit=sales.reduce((s,x)=>s+x.profit,0),qty=sales.reduce((s,x)=>s+x.qty,0);document.getElementById('reports').innerHTML=`<div class="grid stats">${stat('Total omzet',money(omzet),'Semua transaksi')}${stat('Total produk',qty+' pcs','Terjual')}${stat('Total HPP',money(omzet-profit),'Estimasi')}${stat('Gross profit',money(profit),'Margin '+fmtPct(omzet?profit/omzet*100:0))}</div><div class="card section"><h2>Performa produk</h2><table><tr><th>Produk</th><th>Harga</th><th>HPP</th><th>Profit/unit</th><th>Margin</th></tr>${products.map(p=>{let c=hpp(p),pr=p.price-c;return `<tr><td>${p.name}</td><td>${money(p.price)}</td><td>${money(c)}</td><td>${money(pr)}</td><td>${fmtPct(pr/p.price*100)}</td></tr>`}).join('')}</table></div>`}
function renderAdmin(){
 document.getElementById('admin').innerHTML=`
 <div class="grid two">
  <div class="card"><div class="row"><div><h2>Menu & Harga</h2><p class="muted">Ubah nama, harga, emoji, dan resep setiap produk.</p></div><button class="btn primary" onclick="addProduct()">＋ Produk</button></div>
  <div style="margin-top:15px">${products.map((p,i)=>`<div class="card" style="margin-bottom:12px;background:#fafaf7">
   <div class="formgrid">
    <div class="field"><label>Nama menu</label><input value="${esc(p.name)}" onchange="editProduct(${i},'name',this.value)"></div>
    <div class="field"><label>Harga jual (Rp)</label><input type="number" min="0" value="${p.price}" onchange="editProduct(${i},'price',this.value)"></div>
    <div class="field"><label>Emoji</label><input value="${esc(p.emoji)}" onchange="editProduct(${i},'emoji',this.value)"></div>
    <div class="field"><label>HPP saat ini</label><input value="${hpp(p)}" disabled></div>
   </div>
   <div style="margin-top:12px"><b>Resep</b>${p.recipe.map((r,j)=>`<div class="recipe-row">
    <select onchange="editRecipe(${i},${j},this.value)">${ingredients.map(x=>`<option ${x.name===r[0]?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <input type="number" min="0" step="0.01" value="${r[1]}" onchange="editRecipeQty(${i},${j},this.value)">
    <span class="muted">${ing(r[0])?.unit||''}</span><span>${money((ing(r[0])?.cost||0)*r[1])}</span>
    <button class="btn" onclick="removeRecipe(${i},${j})">×</button>
   </div>`).join('')}<button class="btn" style="margin-top:10px" onclick="addRecipe(${i})">＋ Bahan ke resep</button></div>
   <div class="row" style="margin-top:14px"><span class="badge">Margin ${fmtPct((p.price-hpp(p))/p.price*100)}</span><button class="btn" onclick="deleteProduct(${i})">Hapus menu</button></div>
  </div>`).join('')}</div></div>
  <div>
   <div class="card"><div class="row"><div><h2>Bahan & Harga</h2><p class="muted">Semua perubahan harga bahan otomatis mengubah HPP.</p></div><button class="btn primary" onclick="addIngredientAdmin()">＋ Bahan</button></div>
   <div style="margin-top:12px">${ingredients.map((x,i)=>`<div class="recipe-row">
    <input value="${esc(x.name)}" onchange="editIngredient(${i},'name',this.value)">
    <input value="${esc(x.unit)}" onchange="editIngredient(${i},'unit',this.value)">
    <input type="number" min="0" value="${x.cost}" onchange="editIngredient(${i},'cost',this.value)">
    <input type="number" min="0" value="${x.stock}" onchange="editIngredient(${i},'stock',this.value)">
    <button class="btn" onclick="deleteIngredient(${i})">×</button>
   </div>`).join('')}</div>
   <div class="muted" style="font-size:11px;margin-top:8px">Kolom: nama · satuan · harga/unit · stok. Minimum stok & supplier tetap bisa dikelola di halaman Bahan & Stok.</div></div>
   <div class="card section"><h2>Pengaturan Bisnis</h2><div class="formgrid">
    <div class="field"><label>Nama bisnis</label><input value="${esc(settings.business)}" onchange="settings.business=this.value;save()"></div>
    <div class="field"><label>Tagline</label><input value="${esc(settings.tagline)}" onchange="settings.tagline=this.value;save()"></div>
    <div class="field"><label>Mata uang</label><input value="${esc(settings.currency)}" disabled></div>
    <div class="field"><label>Alamat</label><input value="${esc(settings.address)}" onchange="settings.address=this.value;save()"></div>
    <div class="field"><label>Nomor telepon</label><input value="${esc(settings.phone)}" onchange="settings.phone=this.value;save()"></div>
   </div></div>
   <div class="card section"><h2>Data</h2><p class="muted">Simpan otomatis di browser ini (localStorage).</p><button class="btn" onclick="exportBackup()">Export Backup JSON</button> <button class="btn" onclick="importBackup()">Import Backup JSON</button> <button class="btn" onclick="if(confirm('Reset semua data demo?')){localStorage.clear();location.reload()}">Reset Data Demo</button></div>
  </div>
 </div>`
}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function editProduct(i,k,v){products[i][k]=k==='price'?Number(v)||0:v;save();renderAll()}
function addProduct(){let id=Date.now(),p={id,name:'Menu Baru',price:10000,emoji:'🥪',recipe:[]};products.push(p);save();renderAll();showPage('admin')}
function deleteProduct(i){if(products.length<=1)return alert('Minimal harus ada 1 menu.');if(confirm('Hapus menu ini?')){products.splice(i,1);cart=cart.filter(x=>products.some(p=>p.id===x.p.id));save();renderAll()}}
function editRecipe(i,j,name){products[i].recipe[j][0]=name;save();renderAll()}
function editRecipeQty(i,j,v){products[i].recipe[j][1]=Number(v)||0;save();renderAll()}
function addRecipe(i){let n=ingredients[0]?.name;if(!n)return alert('Tambahkan bahan terlebih dahulu.');products[i].recipe.push([n,1]);save();renderAll()}
function removeRecipe(i,j){products[i].recipe.splice(j,1);save();renderAll()}
function editIngredient(i,k,v){ingredients[i][k]=['cost','stock','min'].includes(k)?Number(v)||0:v;save();renderAll()}
function addIngredientAdmin(){ingredients.push({name:'Bahan Baru',unit:'gram',cost:0,stock:0,min:0,supplier:'Supplier baru'});save();renderAll()}
function deleteIngredient(i){let name=ingredients[i].name;if(products.some(p=>p.recipe.some(r=>r[0]===name)))return alert('Bahan masih dipakai di resep. Hapus dari resep terlebih dahulu.');if(confirm('Hapus bahan ini?')){ingredients.splice(i,1);save();renderAll()}}
function exportBackup(){let data={ingredients,products,sales,settings,version:2};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='breadpos-backup.json';a.click()}
function importBackup(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.ingredients)throw Error('Format backup tidak valid');products=d.products;ingredients=d.ingredients;sales=d.sales||[];settings=d.settings||settings;save();renderAll();alert('Backup berhasil diimport')}catch(e){alert('Backup gagal diimport: '+e.message)}};r.readAsText(f)};input.click()}

function exportCSV(){let rows=[['ID','Tanggal','Produk','Qty','Total','Pembayaran','Profit'],...sales.map(x=>[x.id,x.date,x.product,x.qty,x.total,x.payment,x.profit])];let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='breadpos-penjualan.csv';a.click()}
renderNav();renderAll();
</script>
</body></html>
